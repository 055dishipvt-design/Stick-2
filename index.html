<script>

function undoSessions(ids){
 const set=new Set(ids);
 S.q.forEach(q=>{if(q.done&&set.has(q.sid)){q.done=false;q.p=q.p.map(()=>[0,0,0]);delete q.sid;delete q.xp}});
 S.rv.forEach(r=>{if(r.done&&set.has(r.sid)){r.done=false;r.st=[0,0,0];r.xp=0;delete r.sid}});
 S.ses=S.ses.filter(s=>!set.has(s.id));
 fix();save();rAll();
}
function resetDayDialog(){
 const m=$('#md');
 modal(`<b>Reset an entire day</b><small>This clears the completed learning/review progress and removes every session recorded on the selected date. Your subjects, chapters, topics and question titles stay intact.</small><label for="reset-date">Choose date</label><input id="reset-date" type="date" value="${today()}" max="${today()}"/><div class="row"><button class="btn" id="cn">Cancel</button><button class="btn danger" id="ok">Reset day</button></div>`);
 $('#cn').onclick=closeM;
 $('#ok').onclick=async()=>{const date=$('#reset-date').value;if(!date||date>today())return toast('Choose a valid past or current date');const ids=S.ses.filter(s=>s.date===date).map(s=>s.id);if(!ids.length){closeM();return toast('No sessions found for that date')};const yes=await conf(`Reset ${date}? This will remove ${ids.length} session(s) and clear their completed progress.`);if(!yes)return;closeM();undoSessions(ids);toast('Day reset')};
}

const AIP="I am giving you a JSON export of my question bank. Convert it into a CSV with exactly this header row:\nsubject,chapter,topic,number,title,difficulty,parts\n\nRules:\n- subject, chapter, topic: use the names from my data (topic may be blank).\n- number: the question number inside its chapter (blank if unknown).\n- title: the COMPLETE question text exactly as written in my data. Never shorten, summarize or reword it. Keep every word, option and sub-part (a, b, c) of the question.\n- difficulty: map priority to exactly Easy, Moderate or Very Hard (low = Easy, medium = Moderate, high = Very Hard).\n- parts: 1 unless the question clearly has 2 or 3 parts.\n- Ignore dates and any other fields.\n- Put every title in double quotes (double any quotation marks inside it) so commas and line breaks stay intact.\n- Output ONLY the CSV inside one code block. If it is too long, give the first 40 rows and tell me to say 'continue'.\n\nHere is my JSON:\n";
function parseCSV(t){t=t.replace(/^\uFEFF/,'').replace(/^```[a-z]*\n?|```\s*$/gi,'');const l=t.split('\n')[0],d=(l.includes('\t')&&!l.includes(','))?'\t':',',rows=[];let r=[],f='',q=false;
 for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===d){r.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);f='';if(r.some(x=>x.trim()))rows.push(r);r=[]}else f+=c}
 r.push(f);if(r.some(x=>x.trim()))rows.push(r);return rows}
const DMAP=s=>{s=(s||'').toLowerCase().trim();if(/^(easy|low|1|e)$/.test(s))return'Easy';if(/^(very hard|hard|high|3|vh|h|difficult)$/.test(s))return'Very Hard';return'Moderate'};
function importCSV(text){const rows=parseCSV(text);if(rows.length<2)throw new Error('empty');
 const H=rows[0].map(h=>h.trim().toLowerCase()),ix=n=>H.indexOf(n),cs=ix('subject'),cc=ix('chapter'),ct=ix('topic'),cn=ix('number'),ci=ix('title'),cd=ix('difficulty'),cp=ix('parts');
 if(cs<0||cc<0||ci<0)throw new Error('cols');let add=0,skip=0;
 rows.slice(1).forEach(r=>{const g=i=>i<0?'':(r[i]||'').trim(),sn=g(cs),cnm=g(cc),tn=g(ct),title=g(ci);if(!sn||!cnm||!title){skip++;return}
  const eq=(a,b)=>a.toLowerCase()===b.toLowerCase();
  let s=S.subj.find(x=>eq(x.name,sn));if(!s){s={id:uid(),name:sn,ch:[]};S.subj.push(s)}
  let c=s.ch.find(x=>eq(x.name,cnm));if(!c){c={id:uid(),name:cnm,topics:[]};s.ch.push(c)}
  let tp='';if(tn){let t=c.topics.find(x=>eq(x.name,tn));if(!t){t={id:uid(),name:tn};c.topics.push(t)}tp=t.id}
  let n=parseInt(g(cn));if(!n||n<1)n=nextNum(c.id);
  if(S.q.some(q=>q.c===c.id&&q.n===n)){skip++;return}
  S.ctr[c.id]=Math.max(S.ctr[c.id]||0,n);const np=Math.min(3,Math.max(1,parseInt(g(cp))||1));
  S.q.push({id:uid(),s:s.id,c:c.id,topic:tp,n,t:title,d:DMAP(g(cd)),p:Array.from({length:np},()=>[0,0,0]),note:'',done:false});add++});
 fix();save();return{add,skip}}
const act={
 tab:d=>{ui.page=d.p;show()},sc:d=>{ui.sc=d.v;rDash()},
 calprev:()=>{ui.calMonth=shiftMonth(ui.calMonth||today().slice(0,7),-1);ui.calDate=ui.calMonth+'-01';rDash()},
 calnext:()=>{const next=shiftMonth(ui.calMonth||today().slice(0,7),1);if(next<=today().slice(0,7)){ui.calMonth=next;ui.calDate=next===today().slice(0,7)?today():next+'-01';rDash()}},
 calnow:()=>{ui.calMonth=today().slice(0,7);ui.calDate=today();rDash()},
 calday:d=>{ui.calDate=d.v;rDash()},
 st:d=>{const q=Q(d.q);if(!q||lockd(q))return;const p=q.p[+d.p],v=+d.v;p[+d.s]=p[+d.s]===v?0:v;chk(q);sv()},
 rs2:d=>{const r=R(d.q);if(!r)return;const v=+d.v;r.st[+d.s]=r.st[+d.s]===v?0:v;rchk(r);sv()},
 rf:d=>{const r=R(d.r);r.st=[3,3,3];rchk(r);sv()},rd:d=>{S.rv=S.rv.filter(r=>r.id!==d.r);sv()},
 ar:d=>{S.rv.push({id:uid(),qid:d.q,sid:cur().id,st:[0,0,0],done:false,xp:0});sv();toast('Review added')},
 nt:d=>{ui.notes[d.q]=!ui.notes[d.q];rLq()},
 np:d=>{const q=Q(d.q);if(q.p.length<3&&!q.done){q.p.push([0,0,0]);sv()}},
 dq:async d=>{if(await conf('Delete this question?')){S.q=S.q.filter(q=>q.id!==d.q);S.rv=S.rv.filter(r=>r.qid!==d.q);sv()}},
 addq:()=>{const{s,c}=S.sel;if(!s||!c)return toast('Add a chapter first');const n=Math.max(1,+$('#qn').value||nextNum(c));
  if(S.q.some(q=>q.c===c&&q.n===n))return toast('Q'+n+' already exists here');S.ctr[c]=Math.max(S.ctr[c]||0,n);
  S.q.push({id:uid(),s,c,topic:S.sel.t||'',n,t:$('#qt').value.trim(),d:$('#qd').value,p:Array.from({length:+$('#qp').value},()=>[0,0,0]),note:'',done:false});save();rAll()},
 close:async()=>{if(!await conf('Close this session and start the next one?'))return;const s=cur(),sn=sObj(S.sel.s),cn=sn&&sn.ch.find(x=>x.id===S.sel.c);
  s.bonus=bonus(s);s.items=live(s);s.fb={s:S.sel.s,c:S.sel.c,sn:sn?sn.name:'—',cn:cn?cn.name:'—'};s.closed=true;s.date=today();S.ses.push(nses());save();rAll();toast('Session saved')},
 resetday:()=>resetDayDialog(),
 resetsession:async()=>{const s=cur();if(!s)return toast('No current session');const yes=await conf('Reset the current session? Completed learning and review progress from this session will be cleared. Other sessions and your question list will remain.');if(!yes)return;undoSessions([s.id]);toast('Current session reset')},
 resetone:async d=>{const s=S.ses.find(x=>x.id===d.sid);if(!s)return;const yes=await conf(`Reset session S${s.no||'—'} from ${s.date||'unknown date'}? Its completed learning/review progress will be cleared.`);if(!yes)return;undoSessions([s.id]);toast(`Session S${s.no||''} reset`)},
 mg:()=>{ui.mg=!ui.mg;rFrm()},
  theme:()=>{const root=document.documentElement;const dark=root.dataset.theme==='dark'||(!root.dataset.theme&&window.matchMedia('(prefers-color-scheme: dark)').matches);root.dataset.theme=dark?'light':'dark';saveTheme(root.dataset.theme)},
 as:async()=>{const n=await ask('New subject');if(n){const s={id:uid(),name:n,ch:[]};S.subj.push(s);S.sel.s=s.id;fix();save();rAll()}},
 rs:async d=>{const s=sObj(d.s),n=await ask('Rename subject',s.name);if(n){s.name=n;save();rAll()}},
 ds:async d=>{if(await conf('Delete this subject, its chapters and their questions?')){const s=sObj(d.s);s.ch.forEach(c=>delete S.ctr[c.id]);const ids=S.q.filter(q=>q.s===d.s).map(q=>q.id);S.q=S.q.filter(q=>q.s!==d.s);S.rv=S.rv.filter(r=>!ids.includes(r.qid));S.subj=S.subj.filter(x=>x.id!==d.s);fix();save();rAll()}},
 ac:async d=>{const n=await ask('New chapter');if(n){const h={id:uid(),name:n,topics:[]};sObj(d.s).ch.push(h);S.sel.s=d.s;S.sel.c=h.id;S.sel.t='';fix();save();rAll()}},
  at:async d=>{const n=await ask('New topic');if(n){const c=sObj(d.s).ch.find(x=>x.id===d.c);c.topics=c.topics||[];const t={id:uid(),name:n};c.topics.push(t);S.sel.s=d.s;S.sel.c=d.c;S.sel.t=t.id;fix();save();rAll()}},
  rt:async d=>{const c=sObj(d.s).ch.find(x=>x.id===d.c),t=c.topics.find(x=>x.id===d.t),n=await ask('Rename topic',t.name);if(n){t.name=n;save();rAll()}},
  dt:async d=>{if(await conf('Delete this topic? Questions assigned to it will become unassigned.')){const c=sObj(d.s).ch.find(x=>x.id===d.c);c.topics=c.topics.filter(x=>x.id!==d.t);S.q.forEach(q=>{if(q.topic===d.t)q.topic=''});if(S.sel.t===d.t)S.sel.t='';save();rAll()} },
 rc:async d=>{const h=sObj(d.s).ch.find(x=>x.id===d.c),n=await ask('Rename chapter',h.name);if(n){h.name=n;save();rAll()}},
 dc:async d=>{if(await conf('Delete this chapter and its questions?')){const s=sObj(d.s);s.ch=s.ch.filter(x=>x.id!==d.c);const ids=S.q.filter(q=>q.c===d.c).map(q=>q.id);S.q=S.q.filter(q=>q.c!==d.c);S.rv=S.rv.filter(r=>!ids.includes(r.qid));delete S.ctr[d.c];fix();save();rAll()}},
 iq:()=>{modal(`<b>Import questions (CSV)</b><small>Columns: subject, chapter, topic, number, title, difficulty, parts. Missing subjects/chapters/topics are created. Existing question numbers are skipped, and your progress is untouched.</small><button class="btn sg" id="cpp">Copy AI prompt (paste it with your JSON into any chat AI)</button><input id="jf" type="file" accept=".csv,.txt,text/csv"><textarea id="jt" rows="6" placeholder="…or paste CSV here"></textarea><div class="row"><button class="btn" id="cx">Cancel</button><button class="btn pk" id="go">Import</button></div>`);
  $('#cx').onclick=closeM;$('#jf').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(t=>$('#jt').value=t)};
  $('#cpp').onclick=async()=>{try{await navigator.clipboard.writeText(AIP)}catch(e){$('#jt').value=AIP;$('#jt').select();document.execCommand('copy')}toast('Prompt copied')};
  $('#go').onclick=()=>{try{const r=importCSV($('#jt').value);closeM();show();toast(r.add+' added'+(r.skip?', '+r.skip+' skipped':''))}catch(e){toast('Check the CSV header row')}}},
 ex:()=>{const j=JSON.stringify(S,null,1);modal(`<b>Backup (JSON)</b><textarea id="jt" readonly rows="8">${esc(j)}</textarea><div class="row"><button class="btn pk" id="cp">Copy</button><a class="btn" id="dl" download="study-tracker-backup.json">Download</a><button class="btn" id="cx">Close</button></div>`);
  $('#dl').href=URL.createObjectURL(new Blob([j],{type:'application/json'}));$('#cx').onclick=closeM;
  $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(j)}catch(e){$('#jt').select();document.execCommand('copy')}toast('Copied')}},
 im:()=>{modal(`<b>Import backup</b><input id="jf" type="file" accept=".json,application/json"><textarea id="jt" rows="6" placeholder="…or paste JSON here"></textarea><small>This replaces all current data.</small><div class="row"><button class="btn" id="cx">Cancel</button><button class="btn pk" id="go">Import</button></div>`);
  $('#cx').onclick=closeM;$('#jf').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(t=>$('#jt').value=t)};
  $('#go').onclick=()=>{try{const o=JSON.parse($('#jt').value);if(!Array.isArray(o.subj)||!Array.isArray(o.ses))throw 0;S=o;fix();save();closeM();show();toast('Imported')}catch(e){toast('Invalid backup file')}}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&act[b.dataset.a])act[b.dataset.a](b.dataset)});
document.addEventListener('change',e=>{const t=e.target,c=t.dataset.c;if(!c)return;
 if(c==='ssel'){S.sel.s=t.value;S.sel.c='';fix();save();rAll()}else if(c==='csel'){S.sel.c=t.value;S.sel.t='';fix();save();rAll()}else if(c==='tsel'){S.sel.t=t.value;save();rAll()}
 else if(c==='diff'){const q=Q(t.dataset.q);if(q&&!q.done){q.d=t.value;sv()}}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.i==='note'){const q=Q(t.dataset.q);if(q){q.note=t.value;save()}}});
document.addEventListener('keydown',e=>{if(e.target.id==='qt'&&e.key==='Enter')act.addq()});
loadTheme();load();save();show();
